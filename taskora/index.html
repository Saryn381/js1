<!doctype html>
<html lang="en" data-theme="dark" data-accent="blue">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taskora AI — Intelligent Task Management</title>
  <meta name="description" content="AI-assisted task planning and progress tracking for focused work." />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    button,
    .btn,
    [role="button"] {
      color: #ffffff !important;
    }
  </style>
  <script>
    // Apply saved appearance before first paint (no flash)
    try {
      var s = JSON.parse(localStorage.getItem('taskora:settings') || '{}');
      var r = document.documentElement;
      var theme = s.theme || 'system';
      if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      r.setAttribute('data-theme', theme);
      r.setAttribute('data-accent', s.accent || 'blue');
      r.setAttribute('data-font', s.fontSize || 'medium');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <script src="/assets/icons.js"></script>
  <script src="/assets/core.js"></script>
  <script src="/assets/pages-public.js"></script>
  <script src="/assets/pages-app.js"></script>
  <script src="/assets/pages-settings.js"></script>
  <script>T.start();</script>
</body>
</html>
